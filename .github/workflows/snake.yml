name: Cyberpunk Profile Sync

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Generate the Contribution Snake SVG
      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00f2fe&color_dots=#161b22,#0d2e5c,#0c4cb0,#0076ff,#00f2fe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Run generate.mjs to update the Jet Heatmap SVG
      - name: Generate Jet Heatmap SVG
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: github-jet.svg
        run: node generate.mjs

      # 3. Commit and push the generated SVGs back to the repository
      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update profile SVGs [skip ci]"
          file_pattern: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg
            github-jet.svg
