<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#050a18" />
      <stop offset="100%" stop-color="#010206" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f2fe" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>

    <!-- Particle Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background and Grid -->
  <rect width="800" height="450" fill="url(#bgGlow)" />
  <rect width="800" height="450" fill="url(#grid)" />

  <!-- Animated Particles -->
  <!-- Particle 1 -->
  <circle cx="150" cy="300" r="3" fill="#00f2fe" filter="url(#glow)">
    <animate attributeName="cy" values="300;100;300" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.9;0.1" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Particle 2 -->
  <circle cx="320" cy="120" r="2.5" fill="#4facfe" filter="url(#glow)">
    <animate attributeName="cy" values="120;280;120" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Particle 3 -->
  <circle cx="480" cy="380" r="4" fill="#7f00ff" filter="url(#glow)">
    <animate attributeName="cy" values="380;180;380" dur="10s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="10s" repeatCount="indefinite" />
  </circle>

  <!-- Particle 4 -->
  <circle cx="680" cy="220" r="2" fill="#00f2fe" filter="url(#glow)">
    <animate attributeName="cy" values="220;50;220" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Particle 5 -->
  <circle cx="90" cy="80" r="3.5" fill="#7f00ff" filter="url(#glow)">
    <animate attributeName="cy" values="80;220;80" dur="9s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.8;0.1" dur="9s" repeatCount="indefinite" />
  </circle>

  <!-- Particle 6 -->
  <circle cx="600" cy="340" r="2.5" fill="#4facfe" filter="url(#glow)">
    <animate attributeName="cy" values="340;150;340" dur="7.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.85;0.2" dur="7.5s" repeatCount="indefinite" />
  </circle>

  <!-- Particle 7 -->
  <circle cx="230" cy="200" r="2" fill="#00f2fe" filter="url(#glow)">
    <animate attributeName="cy" values="200;390;200" dur="6.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="6.5s" repeatCount="indefinite" />
  </circle>
</svg>
