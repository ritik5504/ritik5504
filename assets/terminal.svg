<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#010409" />
    </radialGradient>

    <!-- Neon Cyan-Blue Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00f2fe" opacity="0.06" />
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background base with glows and scanlines -->
  <rect width="800" height="450" rx="12" fill="url(#bgGlow)" />
  <rect width="800" height="450" rx="12" fill="url(#scanlines)" />

  <!-- Outer Neon Glow Border -->
  <rect x="2" y="2" width="796" height="446" rx="10" fill="none" stroke="url(#borderGrad)" stroke-width="2" filter="url(#neonGlow)" opacity="0.8">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite" />
  </rect>

  <!-- Terminal Title Bar -->
  <g id="titlebar">
    <path d="M 3 12 A 9 9 0 0 1 12 3 L 788 3 A 9 9 0 0 1 797 12 L 797 35 L 3 35 Z" fill="#030712" fill-opacity="0.8" />
    <!-- Window Controls -->
    <circle cx="25" cy="19" r="6" fill="#ef4444" />
    <circle cx="45" cy="19" r="6" fill="#eab308" />
    <circle cx="65" cy="19" r="6" fill="#22c55e" />
    
    <!-- Title Text -->
    <text x="400" y="23" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" fill="#00f2fe" font-weight="bold" letter-spacing="1">
      ritik5504@cyber-terminal ~ %
    </text>

    <!-- Divider Line -->
    <line x1="3" y1="35" x2="797" y2="35" stroke="url(#borderGrad)" stroke-width="1" opacity="0.5" />
  </g>
</svg>
